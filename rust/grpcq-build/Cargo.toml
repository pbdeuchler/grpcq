[package]
name = "grpcq-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Build-time code generation support for grpcq Rust services"

[features]
default = []
tonic = ["dep:tonic-build"]

[dependencies]
heck = "0.5"
proc-macro2 = "1.0"
prost-build = "0.13"
quote = "1.0"
syn = "2.0"
tonic-build = { version = "0.12", optional = true, default-features = false, features = ["prost"] }
